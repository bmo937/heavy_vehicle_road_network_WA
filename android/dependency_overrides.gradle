configurations.all {
    resolutionStrategy {
        // Force specific versions for problematic dependencies
        force 'androidx.appcompat:appcompat:1.7.0'
        force 'androidx.appcompat:appcompat-resources:1.7.0'
        force 'androidx.fragment:fragment:1.8.2'
        force 'androidx.core:core:1.13.1'  // Updated to fix EditorInfoCompat issue
        force 'androidx.lifecycle:lifecycle-runtime:2.8.4'
    }
}